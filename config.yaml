# Groww Weekly Review Pulse configuration. See docs/architecture.md section 9.
# Secrets (GROQ_API_KEY) are read from the environment, never from this file.

app:
  play_package: com.nextbillion.groww
  play_lang: en
  play_country: in

# Review window in weeks. Must be between 8 and 12.
window_weeks: 10

# Hard cap on clustering themes. The pulse highlights the top 3.
max_themes: 5

# Seed taxonomy for theme assignment. The LLM may propose replacements if data does not fit.
taxonomy:
  - Onboarding and KYC
  - Payments and Withdrawals
  - Trading Experience and App Performance
  - Statements and Reports
  - Customer Support

ranking:
  weights:
    volume: 0.5
    recency: 0.2
    severity: 0.3
  recency_window_weeks: 2

pulse:
  max_words: 250
  min_reviews: 20      # below this many clean reviews the run stops instead of guessing

# LLM provider: Groq (OpenAI-compatible chat completions). Model ids per task (architecture section 6).
# Verify these against your account with `python -m pulse check-llm`; Groq retires models, and the
# llama-3.x ids used earlier in this project were shut down on 2026-08-16.
models:
  theme_assign: openai/gpt-oss-20b
  compose: openai/gpt-oss-120b
  judge: openai/gpt-oss-20b

llm:
  batch_size: 40            # reviews per theme-assignment call
  max_retries: 3            # transport/rate-limit/invalid-JSON retries per call
  timeout_s: 60
  max_output_tokens: 4096   # generous: reasoning models spend part of this on hidden reasoning
  reasoning_effort: low     # gpt-oss only (low|medium|high); set to null for models without it

compose:
  candidates_per_theme: 5   # quote candidates offered to the model per top theme
  max_retries: 2            # compose retries with violation feedback (architecture 4.6)

# Google Workspace MCP server (architecture section 7; implementation plan "External Dependency").
# One server (saksham20189575/mcp-server-4, pinned commit in the plan) serves both Docs and Gmail.
# It is launched over stdio as: <command> <server_dir>/<entrypoint>, with cwd=server_dir so it reads
# its own .env and tokens.json. Fill server_dir and document_id after the Phase 0 setup.
# tools maps our logical operations to the server's tool names; these are also the only tools the
# client may call (the allowlist). gmail_send_email is deliberately absent.
mcp:
  server_dir: D:/NextLeap Projects/mcp-server-4   # mcp-server-4 checkout, outside this repo
  command: node
  entrypoint: dist/index.js
  document_id: 1d6vk8c6UHTCj9J96Al-QXWKu8gyJT95xiBmsRcFYExI         # id of the pre-created rolling Google Doc
  tools:
    append_to_document: google_docs_append_content
    create_draft: gmail_create_draft

# Email draft recipient (decided in Phase 0).
draft_to: prachtitest09@gmail.com

paths:
  data_dir: data
  prompts_dir: prompts
