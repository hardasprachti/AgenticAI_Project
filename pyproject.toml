[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groww-pulse"
version = "0.1.0"
description = "Weekly Groww Play Store review pulse delivered to Google Docs and Gmail via MCP"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.30",
    "pydantic>=2.0",
    "mcp>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["src", "tests", "."]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
